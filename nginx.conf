    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    server {
        if ($host = ethan.armstronglabs.net) {
            return 301 https://$host$request_uri;
        } # managed by Certbot

        listen 80;
        server_name ethan.armstronglabs.net;
        return 404; # managed by Certbot
    }

    server {
